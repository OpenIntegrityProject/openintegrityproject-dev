name: Verify commit signatures

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-signatures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # For pull requests, check out the PR head itself: the default
      # refs/pull/N/merge commit is created and left unsigned by GitHub.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Run verifier regression tests
        run: zsh .repo/scripts/tests/TEST-verify_commit_signatures.sh

      - name: Verify every commit against the Open Integrity trust chain
        run: zsh .repo/scripts/verify_commit_signatures.sh
